# Kid Nyce Karaoke reverse proxy. Written by deploy/install-pi.sh; edits are overwritten.
#
# Threat model in short: guests share a venue LAN with strangers. TLS stops
# sniffing and tampering on that LAN, the join code gate in the app stops
# anyone without tonight's code, and the limits stop code guessing and
# request floods. The app itself listens on 127.0.0.1 only. With the Cloudflare
# Tunnel on, kidnyce-karaoke.tunnel.conf adds a loopback only server for
# internet guests; host controls refuse anything that came through it.

limit_req_zone $binary_remote_addr zone=kk_join:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kk_api:10m rate=30r/s;
# Each YouTube search, preview or download starts yt-dlp on the Pi.
limit_req_zone $binary_remote_addr zone=kk_youtube:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=kk_conn:10m;

# WebSocket upgrades pass through; everything else keeps the upstream
# connection alive (an empty Connection header is not sent).
map $http_upgrade $kk_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream kidnyce_karaoke {
    server 127.0.0.1:@@PORT@@;
    keepalive 16;
}

# The Pi's own private address on whatever network it joins, such as
# https://172.16.0.142, also reaches the app. Host login then works even where
# the venue router refuses to resolve the karaoke name to a private address
# (DNS rebinding protection). The browser warns once that the certificate is
# for the karaoke name, not the address. Every other name or address is
# dropped: raw IP scans of public addresses, other names, DNS rebinding.
map $host $kk_lan_host {
    default 0;
    "~^(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})$" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    if ($kk_lan_host) {
        return 308 https://$host$request_uri;
    }
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     @@CERT@@;
    ssl_certificate_key @@KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    if ($kk_lan_host = 0) {
        return 444;
    }

    # The venue network, like the karaoke name: never marked as from the internet.
    set $kk_public "";

    include /etc/nginx/snippets/kidnyce-common.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl@@LISTEN_HTTP2@@;
    listen [::]:443 ssl@@LISTEN_HTTP2@@;
@@HTTP2_DIRECTIVE@@
    server_name @@DOMAIN@@;

    ssl_certificate     @@CERT@@;
    ssl_certificate_key @@KEY@@;

    # Mozilla "intermediate": TLS 1.2 and 1.3, AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KidnyceSSL:10m;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt shut its OCSP responders down in August 2025.

    # The venue network: never marked as from the internet. The proxy snippet
    # sends this as X-Kidnyce-Public, so a client cannot set it itself.
    set $kk_public "";

    include /etc/nginx/snippets/kidnyce-common.conf;
}
