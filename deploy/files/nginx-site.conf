# Kid Nyce Karaoke reverse proxy. Written by deploy/install-pi.sh; edits are overwritten.
#
# Threat model in short: guests share a venue LAN with strangers. TLS stops
# sniffing and tampering on that LAN, the join code gate in the app stops
# anyone without tonight's code, and the limits below stop code guessing and
# request floods. The app itself listens on 127.0.0.1 only.

limit_req_zone $binary_remote_addr zone=kk_join:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kk_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=kk_conn:10m;

# WebSocket upgrades pass through; everything else keeps the upstream
# connection alive (an empty Connection header is not sent).
map $http_upgrade $kk_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream kidnyce_karaoke {
    server 127.0.0.1:@@PORT@@;
    keepalive 16;
}

# Anything not addressed to the karaoke hostname is dropped: raw IP scans,
# other names, and DNS rebinding attempts. No certificate is offered for them.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl@@LISTEN_HTTP2@@;
    listen [::]:443 ssl@@LISTEN_HTTP2@@;
@@HTTP2_DIRECTIVE@@
    server_name @@DOMAIN@@;

    ssl_certificate     @@CERT@@;
    ssl_certificate_key @@KEY@@;

    # Mozilla "intermediate": TLS 1.2 and 1.3, AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KidnyceSSL:10m;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt shut its OCSP responders down in August 2025.

    server_tokens off;
    client_max_body_size 2m;
    # Defaults for every location; streams and sockets raise the read timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Inline scripts stay allowed because the upstream templates use them. Every
    # script file is served from this host; the one CDN script upstream loaded
    # is vendored and pinned in this fork.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    limit_conn kk_conn 64;

    location = /api/healthz {
        access_log off;
        include /etc/nginx/snippets/kidnyce-proxy.conf;
    }

    # Joining is where guessing would happen, so it gets the tightest limit.
    location ~ ^/(join|api/join)(/|$) {
        limit_req zone=kk_join burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/kidnyce-proxy.conf;
    }

    location ^~ /socket.io/ {
        include /etc/nginx/snippets/kidnyce-proxy.conf;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Video segments and progressive streams: no buffering, long reads.
    location ~ ^/(stream|subtitle)/ {
        include /etc/nginx/snippets/kidnyce-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=kk_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/kidnyce-proxy.conf;
    }
}
