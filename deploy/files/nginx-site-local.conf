# Kid Nyce Karaoke reverse proxy, local network only. Written by
# deploy/install-pi.sh --local-only (no domain name, no Cloudflare token);
# edits are overwritten.
#
# Threat model in short: with no domain there is no trusted certificate, so
# phones use plain http on the venue network. Anyone on that same network can
# read the traffic, the admin password included when the host logs in from a
# phone. Log in from the Pi itself or a trusted network, or add a domain later
# (rerun the installer with a Cloudflare token) to get https. The join code
# gate and the rate limits still apply. Only private addresses and local names
# are answered: a public site that points its name at this Pi (DNS rebinding)
# is dropped. The app itself listens on 127.0.0.1 only.

limit_req_zone $binary_remote_addr zone=kk_join:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kk_api:10m rate=30r/s;
# Each YouTube search, preview or download starts yt-dlp on the Pi.
limit_req_zone $binary_remote_addr zone=kk_youtube:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=kk_conn:10m;

map $http_upgrade $kk_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream kidnyce_karaoke {
    server 127.0.0.1:@@PORT@@;
    keepalive 16;
}

# What phones may type: the Pi's private address on whatever network it is on
# (http://172.16.0.142), a name the router or mDNS gives it (raspberrypi,
# raspberrypi.local), and loopback for the installer's own checks.
map $host $kk_lan_host {
    default 0;
    "~^(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|127\.0\.0\.1|localhost)$" 1;
    "~*^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.local)?$" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    if ($kk_lan_host = 0) {
        return 444;
    }

    set $kk_public "";
    set $kk_proto http;

    include /etc/nginx/snippets/kidnyce-common.conf;
}

# Someone who types https:// gets the same app after one certificate warning.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     @@CERT@@;
    ssl_certificate_key @@KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    if ($kk_lan_host = 0) {
        return 444;
    }

    set $kk_public "";
    set $kk_proto https;

    include /etc/nginx/snippets/kidnyce-common.conf;
}
