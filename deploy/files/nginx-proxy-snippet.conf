# Shared proxy settings for Kid Nyce Karaoke. Written by deploy/install-pi.sh.
proxy_pass http://kidnyce_karaoke;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Always set, never passed through from the client. The app treats a loopback
# caller WITHOUT these headers as a screen on the Pi, so every proxied request
# must carry them.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $kk_connection_upgrade;
