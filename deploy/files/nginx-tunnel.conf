# Internet guests through the Cloudflare Tunnel. Written by deploy/install-pi.sh
# when the tunnel is on; edits are overwritten.
#
# cloudflared on this Pi is the only client: it listens on loopback, nothing
# from the network reaches this port, and the firewall opens nothing for it.
# Cloudflare puts the guest's real address in CF-Connecting-IP; trusting it
# from 127.0.0.1 only gives each phone its own rate limit and join attempt
# count instead of one shared by everyone.
server {
    listen 127.0.0.1:@@TUNNEL_PORT@@;
    server_name @@TUNNEL_HOSTNAME@@;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Guests only: the app refuses host login and Settings for these requests.
    set $kk_public 1;

    include /etc/nginx/snippets/kidnyce-common.conf;
}
