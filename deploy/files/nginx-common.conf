# Shared by the venue server (kidnyce-karaoke.conf) and the tunnel server
# (kidnyce-karaoke.tunnel.conf). Written by deploy/install-pi.sh.
# Each server sets $kk_public before including this.

server_tokens off;
client_max_body_size 2m;
# Defaults for every location; streams and sockets raise the read timeout.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Inline scripts stay allowed because the upstream templates use them. Every
# script file is served from this host; the one CDN script upstream loaded
# is vendored and pinned in this fork.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

limit_conn kk_conn 64;

location = /api/healthz {
    access_log off;
    include /etc/nginx/snippets/kidnyce-proxy.conf;
}

# Joining is where guessing would happen, so it gets the tightest limit.
location ~ ^/(join|api/join)(/|$) {
    limit_req zone=kk_join burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/kidnyce-proxy.conf;
}

# YouTube search, preview and download each run yt-dlp, the heaviest work
# the Pi does for a guest, so one phone cannot tie it up.
location ~ ^/(search|api/preview|api/download)$ {
    limit_req zone=kk_youtube burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/kidnyce-proxy.conf;
}

location ^~ /socket.io/ {
    include /etc/nginx/snippets/kidnyce-proxy.conf;
    proxy_read_timeout 1h;
    proxy_buffering off;
}

# Video segments and progressive streams: no buffering, long reads.
location ~ ^/(stream|subtitle)/ {
    include /etc/nginx/snippets/kidnyce-proxy.conf;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location / {
    limit_req zone=kk_api burst=60 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/kidnyce-proxy.conf;
}
